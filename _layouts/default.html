<!doctype html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="site-brand" href="{{ '/' | relative_url }}">Roberto Tamburini</a>
      {% include nav.html %}
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container">
      <small>© {{ site.time | date: '%Y' }} Roberto Tamburini</small>
    </div>
  </footer>

  <script>
    document.querySelectorAll('.gate-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var target = document.getElementById(btn.dataset.target);
        var isOpen = target.classList.toggle('is-open');
        btn.textContent = isOpen ? 'Hide content' : 'I understand, show content';
      });
    });
  </script>

</body>
</html>
